<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madvet — 1 Day Training</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --forest:#1a3a2a; --forest-mid:#264d39; --forest-light:#3d7a57;
  --cream:#f5f0e8; --cream-dark:#ede6d6; --gold:#c8a96e; --gold-light:#e8d5a8;
  --text:#1c2b22; --muted:#5a7060; --white:#fff;
  --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;overflow-x:hidden;}
html{overflow-x:hidden;max-width:100%;}

/* HEADER */
header{background:var(--forest);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.25);flex-wrap:wrap;min-width:0;}
.logo{width:36px;height:36px;border-radius:50%;background:var(--forest-light);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
header h1{font-family:'DM Serif Display',serif;color:var(--cream);font-size:18px;}
header p{color:rgba(245,240,232,.5);font-size:11px;margin-top:1px;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:1;min-width:0;flex-wrap:wrap;}
.day-badge{background:rgba(200,169,110,.15);border:1px solid rgba(200,169,110,.3);border-radius:16px;padding:5px 10px;color:var(--gold-light);font-size:11px;font-weight:600;white-space:nowrap;}

/* LANGUAGE TOGGLE */
.lang-toggle{display:flex;border:1px solid rgba(200,169,110,.3);border-radius:20px;overflow:hidden;}
.lang-btn{padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:rgba(245,240,232,.5);font-family:'DM Sans',sans-serif;transition:all .15s;}
.lang-btn.active{background:rgba(200,169,110,.25);color:var(--gold-light);}
/* MOBILE HEADER */
@media(max-width:540px){
  header{padding:10px 12px;gap:8px;}
  header h1{font-size:15px;}
  header p{display:none;}
  .hdr-right{gap:5px;}
  .lang-btn{padding:4px 8px;font-size:11px;}
  .day-badge{display:none;}
  #prodLink{padding:5px 10px!important;font-size:11px!important;}
}

/* OVERALL PROGRESS */
.top-progress{background:var(--forest-mid);padding:12px 24px;border-bottom:1px solid rgba(200,169,110,.15);}
.tp-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;}
.tp-label{font-size:12px;color:rgba(245,240,232,.5);white-space:nowrap;}
.tp-bar{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
.tp-fill{height:100%;background:linear-gradient(90deg,var(--forest-light),var(--gold));border-radius:3px;transition:width .5s ease;}
.tp-pct{font-size:12px;font-weight:700;color:var(--gold-light);white-space:nowrap;}

/* HOME */
.home{max-width:720px;margin:0 auto;padding:24px 20px 80px;}
.home-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--forest);margin-bottom:4px;}
.home-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
.session-card{background:var(--white);border:1px solid var(--cream-dark);border-radius:16px;padding:18px 20px;margin-bottom:12px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.session-card:hover{border-color:var(--gold);box-shadow:0 4px 20px rgba(26,58,42,.1);transform:translateY(-1px);}
.session-card.done{opacity:.7;}
.session-card.locked{opacity:.5;cursor:not-allowed;}
.session-card.active-now{border-color:var(--forest-light);box-shadow:0 0 0 2px rgba(61,122,87,.2);}
.session-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cream-dark);}
.session-card.done::before{background:var(--green);}
.session-card.active-now::before{background:var(--gold);}
.sess-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.sess-info{flex:1;}
.sess-time{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.sess-name{font-size:15px;font-weight:600;color:var(--forest);margin-bottom:2px;}
.sess-desc{font-size:12px;color:var(--muted);}
.sess-right{text-align:right;flex-shrink:0;}
.sess-count{font-size:13px;font-weight:600;color:var(--forest);}
.sess-status{font-size:11px;color:var(--muted);margin-top:2px;}
.start-btn{padding:7px 16px;border-radius:20px;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s;}
.start-btn.go{background:var(--forest);color:var(--cream);}
.start-btn.go:hover{background:var(--forest-light);}
.start-btn.redo{background:var(--cream-dark);color:var(--muted);}

/* STUDY SCREEN */
.study-screen{display:none;max-width:680px;margin:0 auto;padding:20px 20px 80px;}
.study-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.back-btn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--cream-dark);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;flex-shrink:0;}
.back-btn:hover{border-color:var(--forest);}
.study-title{flex:1;}
.study-title h2{font-size:16px;font-weight:700;color:var(--forest);}
.study-title p{font-size:12px;color:var(--muted);}
.study-prog{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.study-dots{display:flex;gap:4px;flex-wrap:wrap;max-width:120px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cream-dark);transition:background .2s;}
.dot.done-dot{background:var(--green);}
.dot.curr-dot{background:var(--gold);}

/* LEARN CARD */
.learn-card{background:var(--white);border:2px solid var(--cream-dark);border-radius:20px;padding:24px 20px;margin-bottom:16px;box-shadow:0 4px 20px rgba(26,58,42,.07);word-break:break-word;overflow-wrap:break-word;}
.lc-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
.lc-cat{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.lc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.form-badge{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:600;background:var(--cream-dark);color:var(--muted);}
.lc-name{font-family:'DM Serif Display',serif;font-size:clamp(22px,6vw,32px);color:var(--forest);line-height:1.1;margin-bottom:10px;word-break:break-word;}
.lc-salt{font-size:13px;color:var(--muted);background:var(--cream-dark);border-radius:8px;padding:8px 12px;margin-bottom:14px;line-height:1.5;word-break:break-word;overflow-wrap:break-word;}
.lc-salt span{font-weight:600;color:var(--forest);}
.lc-img{width:100%;max-height:180px;object-fit:contain;border-radius:12px;background:#f5f0e8;padding:8px;margin-bottom:14px;display:block;}
.lc-section{margin-bottom:12px;}
.lc-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.use-tags{display:flex;flex-wrap:wrap;gap:5px;}
.use-tag{background:rgba(61,122,87,.08);border:1px solid rgba(61,122,87,.2);border-radius:8px;padding:3px 10px;font-size:12px;color:var(--forest-mid);}
.species-row{font-size:13px;color:var(--muted);}
.tip-box{background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.25);border-radius:10px;padding:10px 14px;font-size:12px;color:#7a5c2a;line-height:1.5;margin-top:12px;}
.tip-box strong{color:var(--forest);}

/* HINDI TIP BOX */
.hindi-tag{display:inline-block;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.25);border-radius:6px;padding:2px 8px;font-size:11px;color:#6d28d9;margin-right:4px;margin-bottom:4px;}

/* NAV BUTTONS */
.card-nav{display:flex;gap:10px;}
.nav-btn{flex:1;padding:13px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;}
.nav-prev{background:var(--cream-dark);color:var(--muted);}
.nav-prev:hover{background:#ddd6c4;}
.nav-next{background:var(--forest);color:var(--cream);}
.nav-next:hover{background:var(--forest-light);}
.nav-next.finish{background:var(--amber);color:var(--forest);}

/* QUIZ */
.quiz-wrap{background:var(--white);border:2px solid var(--cream-dark);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 4px 20px rgba(26,58,42,.07);}
.quiz-q-num{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.quiz-question{font-size:18px;font-weight:600;color:var(--forest);line-height:1.4;margin-bottom:6px;}
.quiz-hint{font-size:13px;color:var(--muted);margin-bottom:18px;}
.options{display:flex;flex-direction:column;gap:10px;}
.opt{padding:13px 16px;border-radius:12px;border:2px solid var(--cream-dark);background:var(--white);text-align:left;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--text);}
.opt:hover:not(:disabled){border-color:var(--forest);background:rgba(26,58,42,.04);}
.opt.correct{border-color:var(--green);background:rgba(34,197,94,.08);color:#15803d;}
.opt.wrong{border-color:var(--red);background:rgba(239,68,68,.08);color:#dc2626;}
.opt.reveal{border-color:var(--green);background:rgba(34,197,94,.05);color:#16a34a;}
.quiz-score-bar{display:flex;gap:10px;margin-bottom:16px;}
.score-pill{flex:1;background:var(--white);border:1px solid var(--cream-dark);border-radius:12px;padding:10px;text-align:center;}
.score-n{font-size:20px;font-weight:700;color:var(--forest);}
.score-l{font-size:11px;color:var(--muted);margin-top:2px;}
.quiz-next-btn{width:100%;padding:13px;border-radius:12px;border:none;background:var(--forest);color:var(--cream);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:none;margin-top:14px;}
.quiz-next-btn:hover{background:var(--forest-light);}

/* SESSION COMPLETE */
.sess-complete{background:var(--white);border:2px solid var(--cream-dark);border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 4px 20px rgba(26,58,42,.07);}
.big-icon{font-size:56px;margin-bottom:12px;}
.sc-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--forest);margin-bottom:8px;}
.sc-sub{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
.sc-stats{display:flex;gap:12px;justify-content:center;margin-bottom:24px;}
.sc-stat{text-align:center;}
.sc-n{font-size:28px;font-weight:700;}
.sc-l{font-size:12px;color:var(--muted);margin-top:2px;}
.sc-btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;background:var(--forest);color:var(--cream);}
.sc-btn:hover{background:var(--forest-light);}
.sc-btn.sec{background:var(--cream-dark);color:var(--muted);}
.sc-btn.sec:hover{background:#ddd6c4;}

/* FINAL COMPLETE */
.final-complete{text-align:center;padding:40px 20px;}
.trophy{font-size:72px;margin-bottom:20px;}
.fc-title{font-family:'DM Serif Display',serif;font-size:32px;color:var(--forest);margin-bottom:12px;}
.fc-sub{font-size:15px;color:var(--muted);margin-bottom:32px;max-width:480px;margin-left:auto;margin-right:auto;line-height:1.6;}
.fc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:360px;margin:0 auto 32px;}
.fc-box{background:var(--white);border:1px solid var(--cream-dark);border-radius:16px;padding:20px;text-align:center;}
.fc-n{font-size:32px;font-weight:700;color:var(--forest);}
.fc-l{font-size:12px;color:var(--muted);margin-top:4px;}
</style>
</head>

// ── FETCH PRODUCTS ────────────────────────────────────────────────────────────
async function loadProducts() {
  try {
    const url = `${SUPABASE_URL}/rest/v1/products_enriched?select=id,product_name,salt_ingredient,packaging,formulation,category,species,indication,description,usp_benefits,image_url&order=id.asc&limit=500`;
    const res = await fetch(url, { headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` }});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    ALL_PRODUCTS = data.map(r => ({
      id: r.id,
      name: (r.product_name||'').trim(),
      salt: (r.salt_ingredient||'').trim(),
      category: (CAT_NORMALIZE[r.category] || r.category || '').trim(),
      formulation: (r.formulation || guessForm(r.packaging||'')).trim(),
      species: (r.species||'').trim(),
      packaging: (r.packaging||'').trim(),
      // English uses only — no Hindi in use tags
      uses: (r.indication||'').split(',').map(s=>s.trim()).filter(s=>s.length>3 && !/[\u0900-\u097F]/.test(s)).slice(0,4),
      // Hindi uses — only Hindi/Hinglish terms
      usesHi: (r.indication||'').split(',').map(s=>s.trim()).filter(s=>s.length>2 && /[\u0900-\u097F]/.test(s)).slice(0,4),
      description: (r.description||'').trim(),
      benefits: (r.usp_benefits||'').trim(),
      image: (r.image_url||'').trim(),
    }));
  } catch(e) {
    console.warn('Supabase not configured — demo mode');
  }
  renderHome();
}

function guessForm(pkg) {
  const p = pkg.toLowerCase();
  if (p.includes('bolus')) return 'Bolus';
  if (p.includes('inj')||p.includes('syringe')) return 'Injection';
  if (p.includes('tablet')||p.includes(' tab')) return 'Tablet';
  if (p.includes('spray')) return 'Spray';
  if (p.includes('gel')) return 'Gel';
  if (p.includes('soap')) return 'Soap';
  if (p.includes('powder')||p.includes('sachet')||/\d+(gm|kg)/.test(p)) return 'Powder';
  if (p.includes('pour-on')||p.includes('pour on')) return 'Pour-On';
  if (p.includes('suspension')) return 'Suspension';
  if (/\d+\s*ml|litre|liter|syrup|liquid|solution/.test(p)) return 'Liquid';
  return '';
}

function getSessionProducts(sess) {
  return ALL_PRODUCTS.filter(p => sess.cats.includes(p.category));
}

function renderHome() {

  document.getElementById('homeTitle').textContent = t('homeTitle');
  document.getElementById('homeSub').textContent   = t('homeSub');
  updateTopProgress();

  const list = document.getElementById('sessionList');
  list.innerHTML = '';

  const allDone = PLAN.every(s => sessProgress[s.id] === 'done');
  if (allDone && ALL_PRODUCTS.length > 0) { renderFinalComplete(); return; }

  let foundActive = false;
  PLAN.forEach((sess, i) => {
    const isDone   = sessProgress[sess.id] === 'done';
    const prevDone = i === 0 || sessProgress[PLAN[i-1].id] === 'done';
    const isActive = !isDone && prevDone;
    if (isActive && !foundActive) foundActive = true;

    const card = document.createElement('div');
    card.className = 'session-card'+(isDone?' done':'')+((!prevDone)?' locked':'')+(isActive?' active-now':'');

    const prods      = getSessionProducts(sess);
    const statusText = isDone ? t('complete') : !prevDone ? t('locked') : t('ready');
    const sessInfo   = T[LANG].sess[i];
    const actualQ    = Math.min(Math.max(sess.quizCount, Math.min(prods.length, 10)), prods.length);

    card.innerHTML = `
      <div class="sess-icon" style="background:${sess.color}20">${sess.icon}</div>
      <div class="sess-info">
        <div class="sess-time">${sessInfo.time}</div>
        <div class="sess-name">${sessInfo.name}</div>
        <div class="sess-desc">${sessInfo.desc}</div>
      </div>
      <div class="sess-right">
        <div class="sess-count">${prods.length||'—'} ${t('products')}</div>
        <div class="sess-status" style="color:${isDone?'var(--green)':isActive?'var(--amber)':'var(--muted)'}">${statusText}</div>
        ${(isActive||isDone)?`<button class="start-btn ${isDone?'redo':'go'}" onclick="startSession(${sess.id})" style="margin-top:6px">${isDone?t('redo'):t('start')}</button>`:''}

    if ((isActive||isDone) && !card.querySelector('.locked')) {

// ── QUIZ PHASE ────────────────────────────────────────────────────────────────
function startQuiz() {
  currentStep  = 'quiz';
  quizIdx      = 0;
  quizCorrect  = 0;
  quizAnswered = false;

  const sess     = currentSess;
  const sessProd = getSessionProducts(sess);
  const shuffled = [...sessProd].sort(()=>Math.random()-.5);

  // Minimum 10 questions, capped by available products
  // If fewer than 10 products, allow repeat question types to reach 10
  const targetQ = Math.min(Math.max(10, sess.quizCount), sessProd.length);
  // Build questions — if not enough products, cycle through with different question types
  quizQ = buildQuizQuestions(shuffled, targetQ);

  const sessInfo = T[LANG].sess[sess.id];
  document.getElementById('studyTitle').textContent    = sessInfo.name + t('quizLabel');
  document.getElementById('studySubtitle').textContent = `${quizQ.length} ${t('questions')}`;
  renderQuiz();
}

function buildQuizQuestions(products, targetCount) {
  const types = ['use2name','name2form','salt2name','name2species','use2category'];
  const questions = [];
  let typeIdx = 0;
  // Cycle through products (and repeat if needed) until we reach targetCount
  for (let i = 0; i < targetCount; i++) {
    const p    = products[i % products.length];
    const type = types[typeIdx % types.length];
    questions.push({ p, type, idx: i });
    typeIdx++;
  }
  return questions;
}

function renderQuiz() {
  if (quizIdx >= quizQ.length) { renderSessionComplete(); return; }
  quizAnswered = false;

  const { p, type } = quizQ[quizIdx];
  const sess  = currentSess;
  const prods = ALL_PRODUCTS.length>0 ? ALL_PRODUCTS : getSessionProducts(sess);

  const sameCat = prods.filter(x=>x.name!==p.name && sess.cats.includes(x.category));
  const others  = [...sameCat, ...prods.filter(x=>x.name!==p.name && !sess.cats.includes(x.category))];
  const wrongs  = others.sort(()=>Math.random()-.5).slice(0,3);
  const options = [p,...wrongs].sort(()=>Math.random()-.5);

  const dots = document.getElementById('studyDots');
  dots.innerHTML = quizQ.map((_,i)=>
    `<div class="dot ${i<quizIdx?'done-dot':i===quizIdx?'curr-dot':''}"></div>`
  ).slice(0,Math.min(quizQ.length,15)).join('');

  let question='', hint='';

  if (type==='use2name') {
    const use = (LANG==='hi' && p.usesHi.length>0) ? p.usesHi[0] : (p.uses[0]||p.description.split('.')[0]||p.category);
    question = LANG==='hi' ? `कौन सा product इलाज करता है: "${use}"?` : `Which product treats: "${use}"?`;
    hint     = `${LANG==='hi'?'Category':'Category'}: ${p.category} · ${p.formulation||p.packaging}`;
  } else if (type==='name2form') {
    question = LANG==='hi' ? `${p.name} किस form में आता है?` : `What formulation is ${p.name}?`;
    hint     = `Category: ${p.category}`;
    const forms = ['Bolus','Injection','Liquid','Tablet','Powder','Spray','Gel','Soap'];
    const correctForm = p.formulation||guessForm(p.packaging);
    const wrongForms  = forms.filter(f=>f!==correctForm).sort(()=>Math.random()-.5).slice(0,3);
    const formOpts    = [correctForm,...wrongForms].sort(()=>Math.random()-.5);
    renderFormQuiz(question, hint, formOpts, correctForm);
    return;
  } else if (type==='salt2name') {
    const saltShort = (p.salt||'').split(',')[0].trim()||p.category;
    question = LANG==='hi' ? `कौन सा product इसमें है: "${saltShort}"?` : `Which product contains: "${saltShort}"?`;
    hint     = `${p.category} · ${p.formulation||p.packaging}`;
  } else if (type==='name2species') {
    question = LANG==='hi' ? `${p.name} किन जानवरों के लिए है?` : `${p.name} is used for which animals?`;
    hint     = `Category: ${p.category}`;
    // Use species options
    const allSpecies = ['Cattle, Buffalo','Cattle, Buffalo, Sheep, Goat','Cattle, Buffalo, Horse','Dog, Cat','Poultry','Sheep, Goat'];
    const correctSp  = p.species;
    const wrongSp    = allSpecies.filter(s=>s!==correctSp).sort(()=>Math.random()-.5).slice(0,3);
    const spOpts     = [correctSp,...wrongSp].sort(()=>Math.random()-.5);
    renderSpeciesQuiz(question, hint, spOpts, correctSp);
    return;
  } else {
    // use2category
    const use = p.uses[0]||p.description.split('.')[0]||p.name;
    question = LANG==='hi' ? `"${use}" के लिए सही category कौन सी है?` : `"${use}" belongs to which category?`;
    hint     = `Product: ${p.name}`;
    const cats     = Object.keys(CAT_COLORS);
    const wrongCats= cats.filter(c=>c!==p.category).sort(()=>Math.random()-.5).slice(0,3);
    const catOpts  = [p.category,...wrongCats].sort(()=>Math.random()-.5);
    renderCatQuiz(question, hint, catOpts, p.category);
    return;
  }

  document.getElementById('studyContent').innerHTML = `
    ${scoreBar()}
    <div class="quiz-wrap">
      <div class="quiz-q-num">${t('q')} ${quizIdx+1} ${t('of')} ${quizQ.length}</div>
      <div class="quiz-question">${question}</div>
      <div class="quiz-hint">${hint}</div>
      <div class="options">
        ${options.map(o=>`<button class="opt" onclick="checkOpt(this,'${escQ(o.name)}','${escQ(p.name)}')">${o.name}</button>`).join('')}
      </div>
      <button class="quiz-next-btn" id="qNext" onclick="nextQuiz()">${quizIdx<quizQ.length-1?t('nextQ'):t('finishSess')}</button>
    </div>
  `;
}

function scoreBar() {
  return `
    <div class="quiz-score-bar">
      <div class="score-pill"><div class="score-n" style="color:var(--green)">${quizCorrect}</div><div class="score-l">${t('correct')}</div></div>
      <div class="score-pill"><div class="score-n">${quizIdx+1}/${quizQ.length}</div><div class="score-l">${t('q')}</div></div>
      <div class="score-pill"><div class="score-n">${quizQ.length-quizIdx-1}</div><div class="score-l">${t('left')}</div></div>
    </div>`;
}

function renderFormQuiz(question, hint, formOpts, correctForm) {
  document.getElementById('studyContent').innerHTML = `
    ${scoreBar()}
    <div class="quiz-wrap">
      <div class="quiz-q-num">${t('q')} ${quizIdx+1} ${t('of')} ${quizQ.length}</div>
      <div class="quiz-question">${question}</div>
      <div class="quiz-hint">${hint}</div>
      <div class="options">
        ${formOpts.map(f=>`<button class="opt" onclick="checkOpt(this,'${f}','${correctForm}')">${f}</button>`).join('')}
      </div>
      <button class="quiz-next-btn" id="qNext" onclick="nextQuiz()">${quizIdx<quizQ.length-1?t('nextQ'):t('finishSess')}</button>
    </div>
  `;
}

function renderSpeciesQuiz(question, hint, opts, correct) {
  document.getElementById('studyContent').innerHTML = `
    ${scoreBar()}
    <div class="quiz-wrap">
      <div class="quiz-q-num">${t('q')} ${quizIdx+1} ${t('of')} ${quizQ.length}</div>
      <div class="quiz-question">${question}</div>
      <div class="quiz-hint">${hint}</div>
      <div class="options">
        ${opts.map(o=>`<button class="opt" onclick="checkOpt(this,'${escQ(o)}','${escQ(correct)}')">${o}</button>`).join('')}
      </div>
      <button class="quiz-next-btn" id="qNext" onclick="nextQuiz()">${quizIdx<quizQ.length-1?t('nextQ'):t('finishSess')}</button>
    </div>
  `;
}

function renderCatQuiz(question, hint, opts, correct) {
  document.getElementById('studyContent').innerHTML = `
    ${scoreBar()}
    <div class="quiz-wrap">
      <div class="quiz-q-num">${t('q')} ${quizIdx+1} ${t('of')} ${quizQ.length}</div>
      <div class="quiz-question">${question}</div>
      <div class="quiz-hint">${hint}</div>
      <div class="options">
        ${opts.map(o=>`<button class="opt" onclick="checkOpt(this,'${escQ(o)}','${escQ(correct)}')">${o}</button>`).join('')}
      </div>
      <button class="quiz-next-btn" id="qNext" onclick="nextQuiz()">${quizIdx<quizQ.length-1?t('nextQ'):t('finishSess')}</button>
    </div>
  `;
}

function escQ(s) { return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function checkOpt(btn, chosen, correct) {
  if (quizAnswered) return;
  quizAnswered = true;
  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim()===correct) b.classList.add(chosen===correct?'correct':'reveal');
  });
  if (chosen===correct) { btn.classList.add('correct'); quizCorrect++; }
  else btn.classList.add('wrong');
  const nb = document.getElementById('qNext');
  if (nb) { nb.style.display='block'; nb.textContent = quizIdx<quizQ.length-1 ? t('nextQ') : t('finishSess'); }
}

function nextQuiz() { quizIdx++; renderQuiz(); }

// ── SESSION COMPLETE ──────────────────────────────────────────────────────────
function renderSessionComplete() {
  const sess  = currentSess;
  const pct   = Math.round((quizCorrect/quizQ.length)*100);
  const emoji = pct>=80?'🎉':pct>=60?'💪':'📚';
  const title = pct>=80?t('excellent'):pct>=60?t('passed'):t('practice');
  const msg   = pct>=80?t('msgExcellent'):pct>=60?t('msgGood'):t('msgPractice');

  if (pct>=60) {
    sessProgress[sess.id]='done';
    localStorage.setItem('mdv_progress', JSON.stringify(sessProgress));
  }

  document.getElementById('studyDots').innerHTML='';
  const sessInfo = T[LANG].sess[sess.id];
  document.getElementById('studyTitle').textContent    = sessInfo.name;
  document.getElementById('studySubtitle').textContent = LANG==='hi'?'Session पूरा':'Session complete';

  document.getElementById('studyContent').innerHTML = `
    <div class="sess-complete">
      <div class="big-icon">${emoji}</div>
      <div class="sc-title">${title}</div>
      <div class="sc-sub">${msg}</div>
      <div class="sc-stats">
        <div class="sc-stat">
          <div class="sc-n" style="color:${pct>=80?'var(--green)':pct>=60?'var(--amber)':'var(--red)'}">${quizCorrect}/${quizQ.length}</div>
          <div class="sc-l">${t('quizScore')}</div>
        </div>
        <div class="sc-stat"><div class="sc-n">${pct}%</div><div class="sc-l">${t('accuracy')}</div></div>
      </div>
      <button class="sc-btn" onclick="goHome()">${pct>=60?t('nextSess'):t('backPlan')}</button>
      <button class="sc-btn sec" onclick="startSession(${sess.id})">${t('redoSess')}</button>
    </div>
  `;
}

function resetAll() {
  sessProgress={};
  localStorage.removeItem('mdv_progress');
  renderHome();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
setLang(LANG);
loadProducts();
</script>
</body>
</html>
